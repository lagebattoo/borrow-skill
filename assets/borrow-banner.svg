<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">借物 · Borrow — Reuse planning before coding</title>
  <desc id="desc">Understand requirements, decide what to adopt, adapt or build, then carry the policy and plan into implementation.</desc>
  <rect width="1200" height="400" rx="24" fill="#101c24"/>
  <path d="M744 0v400M0 330h1200" stroke="#253843" stroke-width="1"/>
  <circle cx="62" cy="65" r="5" fill="#9cdec6"/>
  <text x="78" y="70" fill="#9cdec6" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="3">REUSE PLANNING SKILL</text>
  <text x="56" y="157" fill="#f4f6f3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="68" font-weight="700">Borrow <tspan fill="#a4b7bf" font-size="48">· 借物</tspan></text>
  <text x="58" y="210" fill="#f4f6f3" font-family="Segoe UI, Arial, sans-serif" font-size="25">Decide what to borrow.</text>
  <text x="58" y="247" fill="#a4b7bf" font-family="Segoe UI, Arial, sans-serif" font-size="25">Keep what makes your product yours.</text>
  <g font-family="Consolas, monospace" font-size="15" text-anchor="middle">
    <rect x="58" y="274" width="100" height="32" rx="6" fill="#213d37"/>
    <text x="108" y="296" fill="#b6ead7">ADOPT</text>
    <rect x="170" y="274" width="100" height="32" rx="6" fill="#283c50"/>
    <text x="220" y="296" fill="#c0d8ed">ADAPT</text>
    <rect x="282" y="274" width="100" height="32" rx="6" fill="#443d30"/>
    <text x="332" y="296" fill="#e7d5b2">BUILD</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="792" y="70" fill="#6e8d9b" font-size="13" letter-spacing="2">FROM INTENT TO IMPLEMENTATION</text>
    <path d="M809 109v156" stroke="#395460" stroke-width="2"/>
    <g fill="#101c24" stroke="#9cdec6" stroke-width="2">
      <circle cx="809" cy="115" r="7"/><circle cx="809" cy="187" r="7"/><circle cx="809" cy="259" r="7"/>
    </g>
    <text x="837" y="119" fill="#f4f6f3" font-size="21">Requirements &amp; constraints</text>
    <text x="837" y="146" fill="#91aab5" font-size="15">Understand the product first</text>
    <text x="837" y="191" fill="#f4f6f3" font-size="21">Reuse policy &amp; plan</text>
    <text x="837" y="218" fill="#91aab5" font-size="15">AGENTS.md + project decisions</text>
    <text x="837" y="263" fill="#f4f6f3" font-size="21">Implementation handoff</text>
    <text x="837" y="290" fill="#91aab5" font-size="15">Verify locally, then integrate</text>
    <text x="58" y="370" fill="#a4b7bf" font-size="16">Requirement first. Reuse with a reason.</text>
    <text x="1144" y="370" fill="#9cdec6" font-size="15" text-anchor="end">DESIGN → POLICY → HANDOFF</text>
  </g>
</svg>
